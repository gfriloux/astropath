name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Même porte de qualité que `just ci` en local et que les hooks pre-commit.
      - name: just ci
        run: nix develop --command just ci

      - name: nix flake check
        run: nix flake check
